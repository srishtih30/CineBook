<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CineBook</title>
  <meta name="description" content="CineBook — movie ticket booking (DBMS mini project)" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23f5b942'/><path d='M9 11h14v10H9z' fill='%23111'/><circle cx='12' cy='16' r='1.6' fill='%23f5b942'/><circle cx='20' cy='16' r='1.6' fill='%23f5b942'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Cine<b>Book</b></span>
      </a>

      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="movies">Movies</a>
        <a href="#/shows" data-nav="shows">Showtimes</a>
        <a href="#/bookings" data-nav="bookings">My bookings</a>
        <a href="#/admin" data-nav="admin">Admin</a>
      </nav>

      <div class="user-switch">
        <label for="userSelect">Booking as</label>
        <select id="userSelect" aria-label="Select demo user">
          <option>Loading…</option>
        </select>
        <span class="api-dot" id="apiDot" title="Checking API…"></span>
      </div>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1">
    <div class="loader"><span></span>Loading CineBook…</div>
  </main>

  <footer class="footer container">
    <span>CineBook · DBMS mini project</span>
    <span>HTML · CSS · JS → FastAPI → PostgreSQL</span>
  </footer>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
